<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elf Job Application and Account Creation</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Indie+Flower&family=Mountains+of+Christmas:wght@400;700&display=swap" rel="stylesheet">
  </head>

  <body>
    <header>
      <h1>Elf Job Application and Account Creation</h1>
    </header>

    <main>
      <form action="submitted.html" method="get">
        
        <!-- Radio Buttons - Belief in Santa Claus -->
        <fieldset>
          <legend>Do you believe in Santa Claus?</legend>
          <label><input type="radio" id="believe-yes" name="believe" value="yes" required> Yes</label><br>
          <label><input type="radio" id="believe-ofc" name="believe" value="ofc" required> YES, OF COURSE!</label>
        </fieldset><br>

        <!-- Text Input - Name Input -->
        <div>
          <label for="fname">First name:</label><br>
          <input type="text" id="fname" autocomplete="given-name" name="fname" required><br>
          
          <label for="lname">Last name:</label><br>
          <input type="text" id="lname" autocomplete="family-name" name="lname" required>
        </div><br>

        <!-- Email form -->
        <div>
          <label for="email">Enter your email address:</label><br>
          <input type="email" name="email" id="email" required><br><br>
        </div>

        <!-- Date form - birthday -->
        <div>
          <label for="date">Enter your birthday:</label><br>
          <input type="date" name="date" id="date" required>
        </div><br>

        <!-- Password form -->
        <div>
          <label for="password">Create a password: </label><br>
          <input type="password" name="password" id="password" required minlength="8" pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}" title="Must be at least 8 characters long and contain at least one number, one uppercase letter, and one lowercase letter."><br>
          <small class="password-hint">*Must be at least 8 characters long and contain at least one number, one uppercase letter, and one lowercase letter.</small><br>
        </div><br>

        <!-- Radio buttons -  Nice / Naughty -->
        <fieldset>
          <legend>Have you been naughty or nice? (Don't lie, Santa knows the truth)</legend>
          <label><input type="radio" id="nice" name="nice_or_naughty" value="Nice" required> Nice</label><br>
          <label><input type="radio" id="naughty" name="nice_or_naughty" value="Naughty" required> Naughty</label>
        </fieldset><br>

        <!-- Motivation text area -->
        <div>
          <label for="motivation">What motivates you to apply to this job?</label><br>
          <textarea id="motivation" name="motivation" placeholder="Describe your motivation to be on Santa Claus's team of elves"></textarea>
        </div><br>

        <!-- Drop box - Height Selection -->
        <div>
          <label for="height">
            Choose your height (cm)<br>
            *If you are over 170cm, you may be redirected to our Giants department.<br>
          </label>

          <select name="height" id="height">
            <option value="" selected>--- Select Height ---</option>
            <option value="0-60">0–60</option>
            <option value="61-70">61–70</option>
            <option value="71-80">71–80</option>
            <option value="81-90">81–90</option>
            <option value="91-100">91–100</option>
            <option value="101-110">101–110</option>
            <option value="111-120">111–120</option>
            <option value="121-130">121–130</option>
            <option value="131-140">131–140</option>
            <option value="141-150">141–150</option>
            <option value="151-160">151–160</option>
            <option value="161-170">161–170</option>
            <option value="171-180">171–180</option>
            <option value="181-190">181–190</option>
            <option value="191-200">191–200</option>
            <option value="200+">200+</option>
          </select>
        </div><br>

        <!-- Drop box - Size Selection -->
        <div>
          <label for="select_size">Size (for the uniform)</label><br>
          <select id="select_size" name="size">
            <option value="" selected>Choose your size</option>
            <option value="xxs">XXS</option>
            <option value="xs">XS</option>
            <option value="s">S</option>
            <option value="m">M</option>
            <option value="l">L</option>
            <option value="xl">XL</option>
            <option value="xxl">XXL</option>
          </select>
        </div><br>

        <!-- Skills Checkboxes -->
        <fieldset>
          <legend>Skills and Competencies</legend>
          <label><input type="checkbox" name="skill" value="youth"> Youth Diplomacy & High-Empathy Engagement</label><br>
          <label><input type="checkbox" name="skill" value="overtime"> Peak-Season Q4 Overtime Endurance</label><br>
          <label><input type="checkbox" name="skill" value="testing"> Emergency Cookie & Milk Palatability Testing</label><br>
          <label><input type="checkbox" name="skill" value="db"> Naughty/Nice Ledger Database Administration *twice</label><br>
          <label><input type="checkbox" name="skill" value="culinary"> Sugar-Based Culinary Skills</label><br>
          <label><input type="checkbox" name="skill" value="reindeer"> Reindeer Handling & Stable Care</label><br>
          <label><input type="checkbox" name="skill" value="toy"> Toy Fabrication & Handcrafting</label><br>
          <label><input type="checkbox" name="skill" value="gift"> Gift Wrapping & Presentation</label><br>
          <label><input type="checkbox" name="skill" value="cold"> High-Cold Resilience & Stealth</label><br>
          <label><input type="checkbox" name="skill" value="teamwork"> Cheer Maintenance & Teamwork</label><br>
          <label><input type="checkbox" name="skill" value="calc"> Chimney Ballistics & Spatial Calculation</label><br>
          <label><input type="checkbox" name="skill" value="acoustics"> Toy Acoustics & Squeak Calibration</label><br>
          <label><input type="checkbox" name="skill" value="cocoa"> Thermal Hot Cocoa Engineering</label><br>
          <label><input type="checkbox" name="skill" value="spark"> Magic-Spark Containment</label><br>
          <label><input type="checkbox" name="skill" value="snowdrift"> Snowdrift Cartography</label><br>
          <label><input type="checkbox" name="skill" value="sack"> Sack Physics & Compression</label><br>
          <label><input type="checkbox" name="skill" value="languages"> All-languages-polyglotism</label><br>
          <label><input type="checkbox" name="skill" value="handwriting"> Kids's Handwriting Fluency</label><br>
          <label><input type="checkbox" name="skill" value="ornament"> Rapid Ornament Restoration</label>
        </fieldset><br>


          <!-- Upload CV and other relevant files -->
        <section class="CV_RelevantFiles">
            <label for="CVfile" class="CV_Label">Upload your CV and other relevant files</label>
            <div class="UploadFileButton">
              <input type="file" id="CVfile" name="CVfile" multiple> 
            </div> 
        </section>

          <!-- Any comments part  -->
        <section class="comments_section">
            <label for="comments_box" class="comments_label">Any comments ?</label>
            <textarea id="comments_box" name="comments" class="textarea_comments" placeholder="Comments"></textarea>  
        </section>

          <!-- Selfie upload for preview -->
        <section class="photo_section">
            <label for="photo_file" class="photo_label"> Upload a selfie of yourself to see how you'll look on our team</label>
            <div class="UploadPhotoButton">
              <label for="photo">Photo file</label>
              <input type="file" id="photo" name="photo">
            </div>
        </section>

          <!-- Elf Preview -->
        <section class="selfie_section">
            <div class="elf_selfie_container">
              <img src="ElfSelfie.png" alt="Christmas elf selfie preview">
            </div>
        </section>

          
          <!-- Accept terms checkbox -->
     <input type="checkbox" name="terms" id="terms" required>
     <label for="terms">I accept the <a href="terms.html" target="_blank">Terms & Conditions</a> and <a href="privacy.html" target="_blank">Privacy Policy</a></label><br>

     <!-- Submit button -->
     <input type="submit" value="Submit form" id="submit_button">
          
      </form>
    </main>
  </body>
</html>
