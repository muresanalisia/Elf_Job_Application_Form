<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8"/>
        <link rel="stylesheet" href="styles.css">
    </head>

    <body>
        <header><h1>Elf Job Application</h1></header>
        <!-- Radio buttons - Santa question -->
        <p>Do you believe in Santa Claus?</p>
        <form>
            <input type="radio" id="yes" name="believe">
            <label for="yes">Yes</label><br>
            <input type="radio" id="ofc" name="believe">
            <label for="ofc">YES, OF COURSE!</label><br>
        </form>
        <!-- Radio buttons - First and last name -->
        <form>
            <label for="fname">First name:</label><br>
            <input type="text" id="fname" name="fname"><br>
            <label for="lname">Last name:</label><br>
            <input type="text" id="lname" name="lname">
        </form>
        <form action="#" method="get" class="emailForm">
            <fieldset>
                <label for="email">Enter your email address:</label>
                <input type="email" name="email" id="email" required>
            </fieldset>
        </form>

        <form action="#" method="get" class="dateForm">
            <fieldset>
                <label for="date">Enter your birthday:</label>
                <input type="date" name="date" id="date" required>
            </fieldset>
        </form>

    <!-- Dropdown - Size Selection -->
    
        <form>
        <label for="select_size"> Size (for the uniform) </label>
        <select id="select_size" name="size">
            <option value="choose"> Choose your size </option>
            <option value="xxs">XXS</option>
            <option value="xs"> XS</option>
            <option value="s">S</option>
            <option value="m"> M</option>
            <option value="l">L</option>
            <option value="xl"> XL</option>
            <option value="xxl">XXL</option>
         </select>
        </form>

      <!-- Checkbox - Skills and Competencies -->
      <form>
      <fieldset>
        <legend>Skills and Competencies</legend>
        <input type="checkbox" name="skill" value="youth" id="youth" required>
        <label for="youth">Youth Diplomacy & High-Empathy Engagement</label><br>
        <input type="checkbox" name="skill" value="overtime" id="overtime">
        <label for="overtime">Peak-Season Q4 Overtime Endurance</label><br>
        <input type="checkbox" name="skill" value="testing" id="testing">
        <label for="testing">Emergency Cookie & Milk Palatability Testing</label><br>
        <input type="checkbox" name="skill" value="db" id="db">
        <label for="db">Naughty/Nice Ledger Database Administration *twice</label><br>
        <input type="checkbox" name="skill" value="culinary" id="culinary">
        <label for="culinary">Sugar-Based Culinary Skills</label><br>
        <input type="checkbox" name="skill" value="reindeer" id="reindeer">
        <label for="reindeer">Reindeer Handling & Stable Care</label><br>
        <input type="checkbox" name="skill" value="toy" id="toy">
        <label for="toy">Toy Fabrication & Handcrafting</label><br>
        <input type="checkbox" name="skill" value="gift" id="gift">
        <label for="gift">Gift Wrapping & Presentation</label><br>
        <input type="checkbox" name="skill" value="cold" id="cold">
        <label for="cold">High-Cold Resilience & Stealth</label><br>
        <input type="checkbox" name="skill" value="teamwork" id="teamwork">
        <label for="teamwork">Cheer Maintenance & Teamwork</label><br>
        <input type="checkbox" name="skill" value="calc" id="calc">
        <label for="calc">Chimney Ballistics & Spatial Calculation</label><br>
        <input type="checkbox" name="skill" value="acoustics" id="acoustics">
        <label for="acoustics">Toy Acoustics & Squeak Calibration</label><br>
        <input type="checkbox" name="skill" value="cocoa" id="cocoa">
        <label for="cocoa">Thermal Hot Cocoa Engineering </label><br>
        <input type="checkbox" name="skill" value="spark" id="spark">
        <label for="spark">Magic-Spark Containment</label><br>
        <input type="checkbox" name="skill" value="snowdrift" id="snowdrift">
        <label for="snowdrift">Snowdrift Cartography</label><br>
        <input type="checkbox" name="skill" value="sack" id="sack">
        <label for="sack">Sack Physics  & Compression</label><br>
        <input type="checkbox" name="skill" value="languages" id="languages">
        <label for="languages">All-languages-polyglotism </label><br>
        <input type="checkbox" name="skill" value="handwriting" id="handwriting">
        <label for="handwriting">Kids's Handwriting Fluency</label><br>
        <input type="checkbox" name="skill" value="ornament" id="ornament">
        <label for="ornament">Rapid Ornament Restoration</label>       
     </fieldset>
     </form>

    </body>

</html>
