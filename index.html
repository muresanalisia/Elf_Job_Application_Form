<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />


    </head>

    <body>
        <form action="#" method="get" class="emailForm">
            <fieldset>
                <label for="email">Enter your email address:</label>
                <input type="email" name="email" id="email" required>
            </fieldset>
        </form>

        <form action="#" method="get" class="dateForm">
            <fieldset>
                <label for="date">Enter your birthday:</label>
                <input type="date" name="date" id="date" required>
            </fieldset>
        </form>
    </body>

</html>
